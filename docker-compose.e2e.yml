# Local-only, disposable browser-test stack. It has separate named volumes and
# ports, so `./seed` cannot touch the developer, demo, or production database.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?Set by scripts/e2e/prepare-isolated.sh}
    volumes:
      - e2e_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lms -d lms']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - e2e_ollama_models:/root/.ollama

  app:
    build: ./backend
    environment:
      SERVER_PORT: '8080'
      SERVER_MODE: release
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${E2E_WEB_PORT},http://localhost:${E2E_WEB_PORT}
      DB_DSN: postgres://lms:${E2E_POSTGRES_PASSWORD}@postgres:5432/lms?sslmode=disable
      JWT_SECRET: ${E2E_JWT_SECRET:?Set by scripts/e2e/prepare-isolated.sh}
      JWT_ACCESS_TOKEN_TTL_MINUTES: '15'
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      SUPER_ADMIN_EMAIL: ${E2E_SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${E2E_SUPER_ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: http://127.0.0.1:${E2E_WEB_PORT}
    volumes:
      - e2e_uploads:/app/uploads
    ports:
      - '127.0.0.1:${E2E_API_PORT}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${E2E_API_PORT}/api/v1
    ports:
      - '127.0.0.1:${E2E_WEB_PORT}:3000'
    depends_on:
      app:
        condition: service_healthy

volumes:
  e2e_pgdata:
  e2e_uploads:
  e2e_ollama_models:
